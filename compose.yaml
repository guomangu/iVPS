services:
  zoraxy:
    image: ${ZORAXY_IMAGE:-zoraxydocker/zoraxy:latest}
    container_name: ivps-zoraxy
    restart: unless-stopped
    network_mode: host
    volumes:
      - ${DATA_DIR:-./data}/zoraxy/config:/opt/zoraxy/config:Z,U
      - ${DATA_DIR:-./data}/zoraxy/plugin:/opt/zoraxy/plugin:Z,U
    environment:
      - TZ=${TZ:-UTC}
      - FASTGEOIP=true

  pgadmin:
    image: ${PGADMIN_IMAGE:-dpage/pgadmin4:latest}
    container_name: ivps-pgadmin
    restart: unless-stopped
    network_mode: host
    volumes:
      - ${DATA_DIR:-./data}/pgadmin:/var/lib/pgadmin:Z,U
    environment:
      - TZ=${TZ:-UTC}
      - PGADMIN_LISTEN_PORT=${PGADMIN_PORT:-5050}
      - PGADMIN_DEFAULT_EMAIL=${ADMIN_USER:-admin}@${DOMAIN_NAME:-votre-domaine.com}
      - PGADMIN_DEFAULT_PASSWORD=${ADMIN_PASSWORD:-admin}
